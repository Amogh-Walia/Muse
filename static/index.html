// The places jobs are started from: the jobs they run, their buttons and message line, and how to reload them.
const PANES = {
  cleanup: { ops: ["apply", "undo"], state: cu, buttons: "#cleanup button", msg: "#cleanup-msg",
             reload: async () => { await loadLibrary(); if ($("#cleanup").classList.contains("open")) await openCleanup(); },
             after: () => updateCleanupCount() },
  scrape: { ops: ["musicbrainz"], state: mb, buttons: "#mb button", msg: "#mb-msg",
            reload: async () => { await loadMb(); await loadLibrary(); }, after: () => updateMbCount() },
  art: { ops: ["artwork"], state: art, buttons: "#ops-pane button", msg: "#art-msg",
         reload: async () => { await loadLibrary(); await loadArt(); }, after: () => updateArtCount() },
  lyrics: { ops: ["lyrics"], state: lyr, buttons: "#lyrics-op button", msg: "#lyr-msg",
            reload: async () => { await loadLyricsOp(); await loadLibrary(); } },
  merge: { ops: ["merge"], state: merge, buttons: "#ops-pane button", msg: "#merge-msg",
           reload: async () => { await loadLibrary(); await loadMerge(); } },
  history: { ops: ["undo", "housekeeping"], state: { busy: false }, buttons: "#house button", msg: "#house-msg",
             reload: async () => { await loadLibrary(); await loadHousekeeping(); if ($("#house")) $("#house").innerHTML = housekeepingHtml(); } },
  ingest: { ops: ["scan", "navidrome"], state: { busy: false }, buttons: "#run-scan, #nd-sync", msg: "#ingest-msg", reload: loadLibrary },
};

const jobs = { p: null, local: null, seen: new Set(), timer: null, gen: 0, waiters: [], shown: undefined };
// How long a finished job's summary is still worth showing to a page that comes back (stops and failures: always).
const RECENT = 30 * 60;

// The job running now: the server's, or one this page has just asked for that the server hasn't reported yet.
function currentJob() {
  if (jobs.p && jobs.p.running) return jobs.p;
  return jobs.local ? { running: true, op: jobs.local, done: 0, total: 0 } : null;
}

async function refreshJobs() {
  const p = await fetchProgress();
  if (p) jobs.p = p;
  drawJobs();
}

// Every poll also tells the server a page is watching: lookups nobody watches stop by themselves.
async function pollJobs() {
  const gen = ++jobs.gen;
  clearTimeout(jobs.timer);
  await refreshJobs();
  if (gen === jobs.gen) jobs.timer = setTimeout(pollJobs, currentJob() ? 500 : document.hidden ? 15000 : 4000);
}

const paneVisible = pane => { const el = $(pane.msg); return !!el && el.getClientRects().length > 0; };

function setMsg(pane, text, err) {
  const el = $(pane.msg);
  if (!el) return;
  el.textContent = text;
  el.classList.toggle("err", !!err);
}

// Turn a pane's buttons off while a job runs; on again afterwards (only the ones this turned off).
function setButtons(pane, on) {
  for (const b of document.querySelectorAll(pane.buttons)) {
    if (b.classList.contains("pstop")) continue;
    if (!on && !b.disabled) { b.disabled = true; b.dataset.jobOff = ""; }
    if (on && "jobOff" in b.dataset) { b.disabled = false; delete b.dataset.jobOff; }
  }
}

// Bring the header indicator, the progress bars and the panes in line with the job running now (if any).
function drawJobs() {
  const p = currentJob();
  if (p && p.job !== jobs.shown) {  // a new job: Stop buttons start fresh
    jobs.shown = p.job;
    document.querySelectorAll(".pstop").forEach(b => Object.assign(b, { disabled: false, textContent: "Stop" }));
  }
  $("#job").hidden = !p;
  if (p) {
    const name = JOB_NAMES[p.op] || "job";
    $("#job-name").textContent = name[0].toUpperCase() + name.slice(1) + (p.total ? ` · ${p.done} / ${p.total}` : " · starting…");
    $("#job .pstop").hidden = !p.stoppable;
  }
  for (const box of document.querySelectorAll(".progress[data-ops]")) {
    const mine = !!p && box.dataset.ops.split(" ").includes(p.op);
    box.hidden = !mine;
    if (mine) drawProgress(box, p);
  }
  for (const [name, pane] of Object.entries(PANES)) {
    if (p && pane.ops.includes(p.op) && !pane.state.busy && paneVisible(pane)) attachJob(name);
    if (pane.attached || pane.running) {  // the pane may have been redrawn since the job started
      setButtons(pane, false);
      if (pane.note && $(pane.msg) && !$(pane.msg).textContent) setMsg(pane, pane.note);
    }
    if (!p && !pane.state.busy && paneVisible(pane)) showLast(name);
  }
  if (!p) jobs.waiters.splice(0).forEach(done => done());
}

// Run a job from a pane: its buttons off while it runs, then reload the pane and say how it went.
async function runJob(name, path, body = {}, { onSuccess } = {}) {
  const pane = PANES[name], text = JOB_TEXT[path] || {};
  pane.state.busy = pane.running = true;
  setButtons(pane, false);
  pane.note = (typeof text.label === "function" ? text.label(body) : text.label) || "Working…";
  setMsg(pane, pane.note);
  jobs.local = text.op || pane.ops[0];
  pollJobs();
  let r = null, error = null;
  try { r = await post(path, body); onSuccess?.(r); } catch (err) { error = err; }
  jobs.local = null;
  await refreshJobs();
  try { await pane.reload(); } catch {}
  pane.state.busy = pane.running = false;
  setButtons(pane, true);
  pane.after?.();
  if (error && error.message.startsWith("busy")) setMsg(pane, "Another job is running (see the top of the page). Try again when it has finished.", true);
  else if (error) setMsg(pane, error.message, true);
  else showResult(name, path, r);
  return r;
}

// A job this page didn't start (another tab or device, or before a reload) is running: follow it to the end,
// then reload the pane and show how it ended. Resolves true once it has finished, false if none was running.
function attachJob(name) {
  const pane = PANES[name], p = currentJob();
  if (pane.attached) return pane.attached;
  if (!p || !pane.ops.includes(p.op) || pane.state.busy) return Promise.resolve(false);
  pane.state.busy = true;
  pane.note = `A ${JOB_NAMES[p.op] || "job"} is in progress…`;
  setMsg(pane, pane.note);
  setButtons(pane, false);
  return pane.attached = new Promise(done => jobs.waiters.push(done)).then(async () => {
    pane.attached = null;
    try { await pane.reload(); } catch {}
    pane.state.busy = false;
    setButtons(pane, true);
    pane.after?.();
    showLast(name);
    return true;
  });
}

// The last finished job, if it belongs to this pane and this page hasn't shown it yet.
function showLast(name) {
  const pane = PANES[name], last = jobs.p && jobs.p.last;
  const op = last && (last.op || JOB_TEXT[last.path]?.op);  // a job that failed early never reported its op
  if (!last || jobs.seen.has(last.id) || !pane.ops.includes(op)) return;
  if (!last.error && !last.result?.stopped && last.age > RECENT) return;
  jobs.seen.add(last.id);
  const when = `${last.error ? "The" : "Last"} ${JOB_NAMES[op] || "job"} (${(last.finished_at || "").slice(11, 16)})`;
  if (last.error) return setMsg(pane, `${when} failed: ${last.error}`, true);
  showResult(name, last.path, last.result, `${when}: `);
}

// Sum up a job's result in its pane. A stopped lookup says how far it got and offers to carry on.
function showResult(name, path, r, prefix = "") {
  const pane = PANES[name], text = JOB_TEXT[path] || {};
  if (r && r.job_id) jobs.seen.add(r.job_id);
  if (r && r.stopped) {
    pane.lastStop = r;
    const el = $(pane.msg), left = r.total - r.done;
    if (!el) return;
    el.classList.remove("err");
    el.innerHTML = esc(prefix) + `Stopped after ${r.done} of ${r.total} ${esc(r.unit)}` +
      (r.reason === "unwatched" ? " because no Muse page was open" : "") + ". What was found so far is listed and can be applied. " +
      (left > 0 ? `<button class="btn link" data-continue="${name}">Continue with the other ${left}</button>` : "");
    return;
  }
  let summary = "Done.";
  try { if (text.done) summary = text.done(r); } catch {}
  setMsg(pane, prefix + summary);
}

document.addEventListener("click", e => {
  const b = e.target.closest("[data-continue]");
  if (!b) return;
  const name = b.dataset.continue, r = PANES[name].lastStop;
  if (r && !PANES[name].state.busy) runJob(name, r.continue.path, r.continue.body);
});
$("#job-name").addEventListener("click", () => {
  const home = JOB_HOME[currentJob()?.op];
  if (home === "ingest") { state.view = "ingest"; state.folder = null; render(); }
  else if (home) goOps(home);
});
document.addEventListener("visibilitychange", () => { if (!document.hidden) pollJobs(); });
pollJobs();

</script>
</body>
</html>
